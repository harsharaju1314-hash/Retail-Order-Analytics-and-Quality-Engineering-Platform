name: Retail Platform Quality Engineering CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Automated QE Test Suites & Data Quality Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Data Quality & AWS Simulation Pipeline
        run: |
          python scripts/init_db.py --reset
          python aws/simulate_s3_pipeline.py
          python scripts/run_reconciliation.py

      - name: Execute Full Pytest Test Suite (Unit, API, DQ, UI, AWS)
        run: |
          pytest -v --tb=short

      - name: Generate Excel Test Execution Report
        run: |
          python scripts/generate_excel_report.py

      - name: Upload Test Execution Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Execution-Report
          path: reports/Retail_Order_Test_Execution_Report.xlsx
