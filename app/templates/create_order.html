{% extends "base.html" %}

{% block title %}Create Order - Retail QE Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-cart-plus me-2 text-primary"></i>Create New Retail Order</h4>
                <p class="text-muted small mb-0">Submit a manual order for test scenario execution and validation.</p>
            </div>
            <div class="card-body p-4">
                <div id="form-error-alert" class="alert alert-danger d-none" role="alert"></div>
                <div id="form-success-alert" class="alert alert-success d-none" role="alert"></div>

                <form id="create-order-form">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="customer_id" class="form-label fw-semibold">Customer <span class="text-danger">*</span></label>
                            <select class="form-select" id="customer_id" name="customer_id" required>
                                <option value="">-- Select Customer --</option>
                                {% for customer in customers %}
                                <option value="{{ customer.customer_id }}">{{ customer.first_name }} {{ customer.last_name }} ({{ customer.city }}, {{ customer.state }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="payment_method" class="form-label fw-semibold">Payment Method</label>
                            <select class="form-select" id="payment_method" name="payment_method">
                                <option value="Credit Card">Credit Card</option>
                                <option value="Debit Card">Debit Card</option>
                                <option value="PayPal">PayPal</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="shipping_address" class="form-label fw-semibold">Shipping Address</label>
                        <input type="text" class="form-control" id="shipping_address" name="shipping_address" placeholder="123 Main St, Suite 100">
                    </div>

                    <hr>
                    <h5 class="fw-bold mb-3"><i class="bi bi-boxes me-2 text-primary"></i>Order Line Items</h5>

                    <div id="items-container">
                        <div class="row g-3 item-line mb-3 align-items-end" id="item-line-0">
                            <div class="col-md-7">
                                <label class="form-label small fw-semibold">Product</label>
                                <select class="form-select product-select" name="product_id" required>
                                    <option value="">-- Select Product --</option>
                                    {% for product in products %}
                                    <option value="{{ product.product_id }}" data-price="{{ product.unit_price }}">
                                        {{ product.product_name }} (${{ "%.2f"|format(product.unit_price) }}) - {{ product.category }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Quantity</label>
                                <input type="number" class="form-control item-quantity" name="quantity" min="1" max="100" value="1" required>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-outline-danger w-100 btn-remove-item" disabled>
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-item">
                            <i class="bi bi-plus-circle me-1"></i> Add Another Item
                        </button>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('web.orders_page') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" id="btn-submit-order" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Submit Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
